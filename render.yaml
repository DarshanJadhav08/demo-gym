services:
  - type: web
    name: demo-gym-platform
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter client build && pnpm --filter server seed
    startCommand: cd server && npx tsx src/app.ts
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
